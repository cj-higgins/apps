<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Days</title>
  <meta name="theme-color" content="#E9E5DC">
  <style>html,body{margin:0;min-height:100%;background:#E9E5DC;color:#23211C;font-family:Georgia,serif}body{display:grid;place-items:center}.msg{max-width:32rem;padding:2rem;line-height:1.5;color:#6C685E}</style>
</head>
<body>
  <div class="msg">Loading Days…</div>
  <script>
  (async function(){
    const files = Array.from({length:12},(_,i)=>`./parts/${String(i).padStart(2,'0')}.txt`);
    const chunks = await Promise.all(files.map(async f=>{
      const r = await fetch(f,{cache:'no-cache'});
      if(!r.ok) throw new Error('Missing '+f);
      return (await r.text()).trim();
    }));
    const html = decodeURIComponent(escape(atob(chunks.join(''))));
    document.open(); document.write(html); document.close();
  })().catch(e=>{document.body.innerHTML='<div class="msg">Could not load Days. '+e.message+'</div>'});
  </script>
</body>
</html>
