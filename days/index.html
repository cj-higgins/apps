<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Days</title><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-title' content='Days'><meta name='theme-color' content='#E9E5DC'><style>:root{--p:#E9E5DC;--s:#F4F1EA;--i:#23211C;--m:#6C685E;--f:#9A968B;--l:#D6D1C5;--a:#B0813A;--b:#4E6E8E;--c:#6E5A7E}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font:16px/1.45 Georgia,serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}main{max-width:560px;margin:auto;padding:max(40px,env(safe-area-inset-top)) 22px 90px}.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:22px}.mark{font-size:32px;font-weight:600}.sub,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.sub{font-size:12px;color:var(--f)}.date{font-size:12px;color:var(--m)}.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:30px}.tab,.pill{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--l);border-radius:999px;background:transparent;color:var(--m);padding:7px 14px;font-size:12px}.on{background:var(--i);color:var(--p);border-color:var(--i)}.move,.card{border:1px solid var(--l);border-radius:13px;padding:14px;margin:10px 0;background:transparent}.move{display:flex;gap:13px}.dot{width:23px;height:23px;border:1.5px solid;border-radius:50%;background:transparent;display:grid;place-items:center;flex:none;color:var(--p)}.dot.done{background:currentColor}.label{font-size:17px;font-weight:600}.ey{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:1px}.trig{font-size:13.5px;color:var(--m);font-style:italic;margin-top:4px}.line,.note,.inp,.area,.sel{width:100%;border:1px solid var(--l);background:var(--s);color:var(--i);border-radius:8px;padding:9px;outline:none}.line,.note{border:0;border-bottom:1.5px solid var(--l);border-radius:0;background:transparent}.note{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:8px}.field{margin-top:22px}.fl{font-weight:600;font-size:15px}.hint{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--f)}.div{display:flex;gap:12px;align-items:center;margin:30px 0 16px}.div b{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.5px;text-transform:uppercase;color:var(--f);font-weight:400}.div i{height:1px;background:var(--l);flex:1}.row{display:flex;gap:7px;align-items:center;margin:7px 0}.sel{width:auto;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.x{width:29px;height:29px;border:1px solid var(--l);border-radius:8px;background:transparent;color:var(--f)}.chip{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--l);border-radius:999px;background:transparent;color:var(--f);padding:5px 9px;margin:3px}.chip.on{border-color:var(--c);background:#6E5A7E22;color:var(--c)}.small{font-size:12px;color:var(--f)}.strike{text-decoration:line-through;color:var(--f)}.bar{height:8px;background:var(--l);border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--i);opacity:.7}.backup{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main id='app'>Loading Days…</main><script>(()=>{const D={moves:[{id:'platform',label:'400 words',goal:'Public platform',time:'morning',accent:'#B0813A',trigger:'If I have made my morning coffee and I am at the shoe rack — I write.',note:'ABD by default. CIT when it is alive — but as writing, never the job action.'},{id:'job',label:'Job action',goal:'Creativity without financial anxiety',time:'afternoon',accent:'#4E6E8E',trigger:'If I have finished gym + smoothie and I am at the café — I do the hardest job thing first.',note:'Always the afternoon café. This is the test of the one-and-done paralysis.'},{id:'belonging',label:'One contact move',goal:'Belonging',time:'evening',accent:'#6E5A7E',trigger:'If I have ended my café session — one real move toward another person before I leave.',note:'A text, an RSVP, a schedule. One thing that creates a future.'}],schema:['New thing','Same thing','Solitude','Bar','Friend','Freespace'],belongingPlan:[{day:'—',text:'Frontrunners'},{day:'Wed',text:'Philosophy club'},{day:'Fri',text:'See a friend'}],publication:{label:'Publish or revise',witness:'Adam',stake:'$5'},objective:'',objectiveGoal:'',objectiveTrigger:'',objectiveAccent:'#5E7A5E'},A=document.getElementById('app'),W=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];let mode='log',cfg=norm(load('days:config',D)),days=load('days:days',{}),weeks=load('days:weeks',{});function e(s){return String(s??'').replace(/[&<>']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',[`'`]:'&#39;'}[c]))}function load(k,f){try{let v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}}function save(){localStorage.setItem('days:config',JSON.stringify(cfg));localStorage.setItem('days:days',JSON.stringify(days));localStorage.setItem('days:weeks',JSON.stringify(weeks))}function norm(c){c=c&&typeof c=='object'?c:{};return{...D,...c,moves:Array.isArray(c.moves)&&c.moves.length?c.moves:D.moves,schema:Array.isArray(c.schema)&&c.schema.length?c.schema:D.schema,belongingPlan:plan(c.belongingPlan||D.belongingPlan),publication:{...D.publication,...(c.publication||{})}}}function plan(p){return(p||[]).map(x=>({day:x.day||'—',text:x.text||'',done:!!x.done,tags:Array.isArray(x.tags)?x.tags:[]}))}function fk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function pk(k){let [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}function mon(d){let x=new Date(d),o=(x.getDay()+6)%7;x.setDate(x.getDate()-o);x.setHours(0,0,0,0);return x}function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function tk(){return fk(new Date)}function wk(){return fk(mon(new Date))}function cur(){let t=tk(),w=wk();days[t]=days[t]||{logged:{},win:''};weeks[w]={plan:plan((weeks[w]||{}).plan||cfg.belongingPlan),gear:!!(weeks[w]||{}).gear,checkedInAt:(weeks[w]||{}).checkedInAt||null};return{t,w,d:days[t],we:weeks[w]}}function moves(){let m=[...cfg.moves];if(cfg.objective&&cfg.objective.trim())m.push({id:'objective',label:cfg.objective,goal:cfg.objectiveGoal||'Rotating objective',time:'rotating',accent:cfg.objectiveAccent||'#5E7A5E',trigger:cfg.objectiveTrigger||''});return m}function head(c){return `<div class='top'><div><div class='mark'>Days</div><div class='sub'>where can we live but days</div></div><div class='date mono'>${pk(c.t).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div></div><div class='tabs'>${['log','design','track'].map(x=>`<button data-mode='${x}' class='tab ${mode==x?'on':''}'>${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>`}function div(s){return `<div class='div'><b>${s}</b><i></i></div>`}function render(){let c=cur();A.innerHTML=head(c)+(mode=='design'?design():mode=='track'?track(c):log(c));save()}function log(c){let ms=moves();return ms.map(m=>{let L=c.d.logged||{},on=L[m.id];return `<div class='move' style='border-color:${on?m.accent+'55':'var(--l)'};background:${on?m.accent+'12':'transparent'}'><button class='dot ${on?'done':''}' data-act='mv:${m.id}' style='border-color:${m.accent};color:${m.accent}'>${on?'✓':''}</button><div style='flex:1'><div><span class='ey' style='color:${m.accent}'>${e(m.time)}</span> <span class='label'>${e(m.label)}</span>${on?` <span class='small'>· ${e(on.time)}</span>`:''}</div>${m.trigger?`<div class='trig'>${e(m.trigger)}</div>`:''}${on?`<input class='note' data-note='${m.id}' value='${e(on.note||'')}' placeholder='what it was, if you want to remember…'>`:''}</div></div>`}).join('')+`<div class='field'><div class='fl'>Today, in a line</div><input class='line' data-win value='${e(c.d.win||'')}' placeholder='one true thing about today — even a small one'></div>${div('this week')}<div class='field'><div class='fl'>Belonging schedule</div><div class='hint'>each item can be checked off and tagged</div>${c.we.plan.map((p,i)=>row(p,i,'week')).join('')}<button class='pill' data-act='add'>+ add to this week</button> <button class='pill' data-act='copy'>copy Design template</button></div><div class='field'><div class='fl'>Publication — witnessed by ${e(cfg.publication.witness)}</div><button class='pill ${c.we.gear?'on':''}' data-act='gear'>${e(c.we.gear?cfg.publication.label+' — done this week':cfg.publication.label)}</button></div>${div('backup')}<div class='backup'><button class='pill' data-act='export'>Export backup</button><label class='pill'>Import backup<input id='imp' type='file' accept='application/json,.json' style='display:none'></label></div>`}function row(p,i,scope){return `<div class='card'><div class='row'>${scope=='week'?`<button class='dot ${p.done?'done':''}' data-act='done:${i}' style='border-color:var(--c);color:var(--c);width:19px;height:19px'>${p.done?'✓':''}</button>`:''}<select class='sel' data-day='${scope}:${i}'>${['—',...W].map(d=>`<option ${p.day==d?'selected':''}>${d}</option>`).join('')}</select><input class='inp ${p.done?'strike':''}' data-text='${scope}:${i}' value='${e(p.text)}'><button class='x' data-act='del:${scope}:${i}'>×</button></div>${scope=='week'?`<div>${cfg.schema.map(t=>`<button class='chip ${(p.tags||[]).includes(t)?'on':''}' data-act='tag:${i}:${e(t)}'>${e(t)}</button>`).join('')}</div>`:''}</div>`}function design(){return `<p style='color:var(--m);line-height:1.6;margin-top:0'>The standing template. New weeks copy from here; the current week is edited in Log.</p>${div('daily moves')}${cfg.moves.map((m,i)=>`<div class='card'><div class='ey' style='color:${m.accent}'>${e(m.time)}</div><input class='inp' data-edit='m:${i}:label' value='${e(m.label)}'><textarea class='area' data-edit='m:${i}:trigger'>${e(m.trigger)}</textarea></div>`).join('')}${div('rotating objective')}<input class='inp' data-edit='c:objective' value='${e(cfg.objective||'')}' placeholder='optional fourth checkbox'><textarea class='area' data-edit='c:objectiveTrigger' placeholder='if-then trigger'>${e(cfg.objectiveTrigger||'')}</textarea>${div('belonging template')}${cfg.belongingPlan.map((p,i)=>row(p,i,'template')).join('')}<button class='pill' data-act='addt'>+ add an idea</button>${div('tags + publication')}<textarea class='area' data-edit='c:schema'>${e(cfg.schema.join(', '))}</textarea><input class='inp' data-edit='p:label' value='${e(cfg.publication.label)}'><input class='inp' data-edit='p:witness' value='${e(cfg.publication.witness)}'><input class='inp' data-edit='p:stake' value='${e(cfg.publication.stake)}'><p class='small'>Saved automatically, on this device.</p>`}function sum(k){let m=mon(pk(k)),cells=[0,1,2,3,4,5,6].map(i=>fk(add(m,i))),ms=moves(),counts={};ms.forEach(x=>counts[x.id]=cells.filter(d=>days[d]?.logged?.[x.id]).length);let w=weeks[k]||{},pl=plan(w.plan||[]),wins=cells.map(d=>days[d]?.win).filter(Boolean);return{k,span:pk(k).toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+add(pk(k),6).toLocaleDateString(undefined,{month:'short',day:'numeric'}),counts,pl,wins,gear:w.gear}}function track(c){let keys=[...new Set([...Object.keys(weeks),...Object.keys(days).map(k=>fk(mon(pk(k))))])].filter(k=>pk(k)<pk(c.w)).sort((a,b)=>pk(b)-pk(a));if(!keys.length)return `<p class='small'>No past weeks yet. When this week rolls over, it will settle here.</p>`;return keys.map(k=>{let s=sum(k);return `<div class='card'><b>${e(s.span)}</b><div class='small mono'>${k}</div>${s.pl.map(p=>`<div class='row'><span class='mono small' style='width:34px'>${e(p.day)}</span><span class='${p.done?'strike':''}'>${e(p.text||'Untitled')}</span></div>`).join('')}<div>${moves().map(m=>`<span class='chip'>${e(m.label)} ×${s.counts[m.id]||0}</span>`).join('')}</div>${s.wins.map(w=>`<p style='font-size:14px'>${e(w)}</p>`).join('')}</div>`}).join('')}A.onclick=ev=>{let b=ev.target.closest('[data-mode],[data-act]');if(!b)return;if(b.dataset.mode){mode=b.dataset.mode;render();return}let c=cur(),p=b.dataset.act.split(':'),pl;if(p[0]=='mv'){let id=p[1],L=c.d.logged||{};L[id]?delete L[id]:L[id]={time:new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})};c.d.logged=L}else if(p[0]=='done'){pl=plan(c.we.plan);pl[p[1]].done=!pl[p[1]].done;c.we.plan=pl}else if(p[0]=='tag'){pl=plan(c.we.plan);let t=p.slice(2).join(':'),a=pl[p[1]].tags||[];pl[p[1]].tags=a.includes(t)?a.filter(x=>x!=t):[...a,t];c.we.plan=pl}else if(p[0]=='del'){let arr=p[1]=='template'?cfg.belongingPlan:c.we.plan;arr.splice(+p[2],1)}else if(p[0]=='add')c.we.plan=plan(c.we.plan).concat({day:'—',text:'',done:false,tags:[]});else if(p[0]=='copy')c.we.plan=plan(cfg.belongingPlan);else if(p[0]=='gear')c.we.gear=!c.we.gear;else if(p[0]=='addt')cfg.belongingPlan=plan(cfg.belongingPlan).concat({day:'—',text:''});else if(p[0]=='export'){let a=document.createElement('a'),blob=new Blob([JSON.stringify({_app:'days',_version:4,_exportedAt:new Date().toISOString(),config:cfg,days,weeks},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='days-backup-'+tk()+'.json';a.click();return}render()};A.oninput=ev=>{let c=cur(),x=ev.target;if(x.dataset.note){c.d.logged[x.dataset.note].note=x.value}else if('win'in x.dataset)c.d.win=x.value;else if(x.dataset.day){let[s,i]=x.dataset.day.split(':'),arr=s=='template'?cfg.belongingPlan:c.we.plan;arr[i].day=x.value}else if(x.dataset.text){let[s,i]=x.dataset.text.split(':'),arr=s=='template'?cfg.belongingPlan:c.we.plan;arr[i].text=x.value}else if(x.dataset.edit){let p=x.dataset.edit.split(':');if(p[0]=='m')cfg.moves[p[1]][p[2]]=x.value;else if(p[0]=='c'&&p[1]=='schema')cfg.schema=x.value.split(',').map(s=>s.trim()).filter(Boolean);else if(p[0]=='c')cfg[p[1]]=x.value;else if(p[0]=='p')cfg.publication[p[1]]=x.value}save()};A.onchange=ev=>{if(ev.target.id=='imp'){let f=ev.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let b=JSON.parse(r.result);if(b._app!='days')return alert('That does not look like a Days backup.');cfg=norm(b.config);days=b.days||{};weeks=b.weeks||{};render()}catch{alert('Could not read that file.')}};r.readAsText(f)}};render()})()</script></body></html>
