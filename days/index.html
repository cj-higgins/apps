(function(){var icon='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='108' fill='#23211C'/><line x1='96' y1='256' x2='416' y2='256' stroke='#6C685E' stroke-width='5'/><circle cx='152' cy='256' r='26' fill='#B0813A'/><circle cx='256' cy='256' r='26' fill='#4E6E8E'/><circle cx='360' cy='256' r='26' fill='#6E5A7E'/></svg>`);var manifest={name:'Days',short_name:'Days',start_url:'.',display:'standalone',background_color:'#E9E5DC',theme_color:'#E9E5DC',icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};var blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});var link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(blob);document.head.appendChild(link)})();

<script type='text/babel' data-presets='react'>
const {useState,useEffect}=React;
function loadKey(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}}
function saveKey(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function exportData(){const b={_app:'days',_version:3,_exportedAt:new Date().toISOString(),config:loadKey('days:config',null),days:loadKey('days:days',{}),weeks:loadKey('days:weeks',{})};const blob=new Blob([JSON.stringify(b,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='days-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000)}
const fmtKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const mondayOf=d=>{const x=new Date(d);const off=(x.getDay()+6)%7;x.setDate(x.getDate()-off);x.setHours(0,0,0,0);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayKey=()=>fmtKey(new Date());
const weekKeyForDate=d=>fmtKey(mondayOf(d));
const weekKey=()=>weekKeyForDate(new Date());
const nextWeekKey=k=>fmtKey(addDays(parseKey(k),7));
const prettyDate=k=>parseKey(k).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
const shortDate=k=>parseKey(k).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const nowTime=()=>new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DEFAULT_CONFIG={moves:[{id:'platform',goal:'Public platform',label:'400 words',time:'morning',accent:'#B0813A',trigger:`If I've made my morning coffee and I'm at the shoe rack — I write.`,note:`ABD by default. CIT when it's alive — but as writing, never the job action.`},{id:'job',goal:'Creativity without financial anxiety',label:'Job action',time:'afternoon',accent:'#4E6E8E',trigger:`If I've finished gym + smoothie and I'm at the café — I do the hardest job thing first.`,note:'Always the afternoon café. This is the test of the one-and-done paralysis.'},{id:'belonging',goal:'Belonging',label:'One contact move',time:'evening',accent:'#6E5A7E',trigger:`If I've ended my café session — one real move toward another person before I leave.`,note:'A text, an RSVP, a schedule. One thing that creates a future.'}],schema:['New thing','Same thing','Solitude','Bar','Friend','Freespace'],belongingPlan:[{day:'—',text:'Frontrunners'},{day:'Wed',text:'Philosophy club'},{day:'Fri',text:'See a friend'}],publication:{label:'Publish or revise',witness:'Adam',stake:'$5'},objective:'',objectiveGoal:'',objectiveTrigger:'',objectiveAccent:'#5E7A5E'};
const TIME_POS={morning:18,afternoon:52,evening:84};
const clonePlan=plan=>(plan||[]).map(p=>({day:p.day||'—',text:p.text||'',done:!!p.done,tags:Array.isArray(p.tags)?p.tags:[]}));
const makeWeek=config=>({plan:clonePlan(config.belongingPlan||[]),gear:false,checkedInAt:null,planUpdatedAt:new Date().toISOString()});
const normalizeWeek=(config,w)=>{const base=makeWeek(config);return{...base,...(w||{}),plan:w?.plan?clonePlan(w.plan):base.plan,gear:!!w?.gear,checkedInAt:w?.checkedInAt||null}};
const activeMoves=config=>config.objective&&config.objective.trim()?[...config.moves,{id:'objective',goal:config.objectiveGoal||'Rotating objective',label:config.objective.trim(),eyebrow:'rotating',accent:config.objectiveAccent||'#5E7A5E',trigger:config.objectiveTrigger||''}]:config.moves;
function App(){const[mode,setMode]=useState('log');const[config,setConfig]=useState(()=>loadKey('days:config',DEFAULT_CONFIG));const[days,setDays]=useState(()=>loadKey('days:days',{}));const[weeks,setWeeks]=useState(()=>loadKey('days:weeks',{}));const tk=todayKey(),wk=weekKey();const today=days[tk]||{logged:{},win:''};const week=normalizeWeek(config,weeks[wk]);useEffect(()=>saveKey('days:config',config),[config]);useEffect(()=>saveKey('days:days',days),[days]);useEffect(()=>saveKey('days:weeks',weeks),[weeks]);useEffect(()=>{setWeeks(w=>w[wk]?.plan?w:{...w,[wk]:normalizeWeek(config,w[wk])})},[wk]);const setToday=patch=>setDays(d=>({...d,[tk]:{...today,...patch}}));const setWeek=patch=>setWeeks(w=>{const cur=normalizeWeek(config,w[wk]);const upd=typeof patch==='function'?patch(cur):patch;return{...w,[wk]:{...cur,...upd,planUpdatedAt:new Date().toISOString()}}});return <div style={S.page}><div style={S.wrap}><Header {...{mode,setMode,tk}}/>{mode==='log'&&<LogLayer {...{config,today,week,setToday,setWeek,setWeeks,days,tk,wk}}/>}{mode==='design'&&<DesignLayer {...{config,setConfig}}/>}{mode==='track'&&<TrackLayer {...{config,days,weeks,wk}}/>}{mode==='visuals'&&<VisualsLayer {...{config,days,weeks,wk}}/>}</div></div>}
function Header({mode,setMode,tk}){return <header style={{marginBottom:32}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',flexWrap:'wrap',gap:8}}><div><div style={S.mark}>Days</div><div style={{...S.mono,color:C.faint,fontSize:12,marginTop:2}}>where can we live but days</div></div><div style={{...S.mono,color:C.muted,fontSize:12}}>{prettyDate(tk)}</div></div><div style={{display:'flex',gap:4,marginTop:22,flexWrap:'wrap'}}>{[['log','Log'],['design','Design'],['track','Track'],['visuals','Visuals']].map(([id,l])=><button key={id} onClick={()=>setMode(id)} style={{...S.tab,...(mode===id?S.tabOn:{})}}>{l}</button>)}</div></header>}
function LogLayer({config,today,week,setToday,setWeek,setWeeks,days,tk,wk}){const moves=activeMoves(config);const plan=week.plan||[];const logMove=id=>{if(today.logged[id]){const{[id]:_,...rest}=today.logged;setToday({logged:rest})}else{const m=moves.find(x=>x.id===id);const entry={time:nowTime()};if(m){entry.label=m.label;entry.accent=m.accent}setToday({logged:{...today.logged,[id]:entry}})}};const setMoveNote=(id,text)=>setToday({logged:{...today.logged,[id]:{...today.logged[id],note:text}}});const setPlan=next=>setWeek({plan:next});const setPlanItem=(i,patch)=>setPlan(plan.map((p,j)=>j===i?{...p,...patch}:p));const addPlan=()=>setPlan([...plan,{day:'—',text:'',done:false,tags:[]}]);const delPlan=i=>setPlan(plan.filter((_,j)=>j!==i));const toggleTag=(i,tag)=>{const p=plan[i]||{};const tags=p.tags||[];setPlanItem(i,{tags:tags.includes(tag)?tags.filter(t=>t!==tag):[...tags,tag]})};const resetPlan=()=>{if(!plan.length||confirm(`Replace this week's plan with the Design template?`))setPlan(clonePlan(config.belongingPlan||[]))};const checkIn=()=>{const nw=nextWeekKey(wk);setWeeks(w=>{const cur=normalizeWeek(config,w[wk]);const next=w[nw]?normalizeWeek(config,w[nw]):makeWeek(config);return{...w,[wk]:{...cur,plan:clonePlan(plan),checkedInAt:new Date().toISOString(),planUpdatedAt:new Date().toISOString()},[nw]:next}})};return <div><DayArc moves={moves} logged={today.logged}/><section style={{marginTop:6}}>{moves.map(m=>{const done=!!today.logged[m.id];const eyebrow=m.time||m.eyebrow||'';return <div key={m.id} style={{...S.move,borderColor:done?m.accent+'55':C.line,background:done?m.accent+'0E':'transparent'}}><button onClick={()=>logMove(m.id)} aria-label={'log '+m.label} style={{...S.node,borderColor:m.accent,background:done?m.accent:'transparent'}}>{done?<Check/>:null}</button><div style={{flex:1,minWidth:0}}><div style={{display:'flex',alignItems:'baseline',gap:8,flexWrap:'wrap'}}>{eyebrow&&<span style={{...S.mono,fontSize:10.5,letterSpacing:1,textTransform:'uppercase',color:m.accent}}>{eyebrow}</span>}<span style={S.moveLabel}>{m.label}</span>{done&&<span style={{...S.mono,fontSize:11,color:C.faint}}>· logged {today.logged[m.id].time}</span>}</div>{m.trigger?<div style={S.trigger}>{m.trigger}</div>:null}{done&&<input value={today.logged[m.id].note||''} onChange={e=>setMoveNote(m.id,e.target.value)} placeholder='what it was, if you want to remember…' style={S.noteInput}/>}</div></div>})}</section><Field label='Today, in a line'><input value={today.win||''} onChange={e=>setToday({win:e.target.value})} placeholder='one true thing about today — even a small one' style={S.lineInput}/></Field><Divider label='this week'/><Field label='Belonging schedule' hint='each plan item can be checked off and tagged'><div style={{marginTop:6}}>{plan.length===0?<div style={{...S.mono,fontSize:11.5,color:C.faint}}>no weekly plan yet — add one here or copy the Design template.</div>:plan.map((p,i)=><div key={i} style={S.planCard}><div style={{display:'flex',gap:7,alignItems:'center'}}><button onClick={()=>setPlanItem(i,{done:!p.done})} style={{...S.node,width:18,height:18,borderColor:C.dusk,background:p.done?C.dusk:'transparent',marginTop:0}} aria-label='mark plan item done'>{p.done?<Check small/>:null}</button><select value={p.day} onChange={e=>setPlanItem(i,{day:e.target.value})} style={S.daySelect}>{['—',...DOW].map(d=><option key={d} value={d}>{d}</option>)}</select><input value={p.text} onChange={e=>setPlanItem(i,{text:e.target.value})} placeholder='Frontrunners · philosophy club · a friend · a weird play…' style={{...S.input,flex:1,textDecoration:p.done?'line-through':'none',color:p.done?C.faint:C.ink}}/><button onClick={()=>delPlan(i)} style={S.del} aria-label='remove'>×</button></div><div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:8,marginLeft:33}}>{config.schema.map(tag=>{const on=(p.tags||[]).includes(tag);return <button key={tag} onClick={()=>toggleTag(i,tag)} style={{...S.chip,padding:'5px 9px',fontSize:11,...(on?S.chipOn:{})}}>{tag}</button>})}</div></div>)}</div><div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:8}}><button onClick={addPlan} style={S.addBtn}>+ add to this week</button><button onClick={resetPlan} style={S.addBtn}>copy Design template</button><button onClick={checkIn} style={{...S.addBtn,borderColor:C.ink+'55',color:C.ink}}>log weekly check-in</button></div>{week.checkedInAt&&<div style={{...S.mono,fontSize:11,color:C.faint,marginTop:8}}>checked in {new Date(week.checkedInAt).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>}</Field><Field label={'Publication — witnessed by '+config.publication.witness} hint={'the one stake: miss it and '+config.publication.stake+' to '+config.publication.witness+', dumb memo'}><Toggle on={week.gear} onClick={()=>setWeek({gear:!week.gear})} off={config.publication.label} onLabel={config.publication.label+' — done this week'}/></Field><Divider label='this week so far'/><WeekStrip moves={moves} days={days} tk={tk}/></div>}
function WeekStrip({moves,days,tk}){const mon=mondayOf(new Date());const cells=Array.from({length:7},(_,i)=>fmtKey(addDays(mon,i)));const wins=cells.map(k=>({k,win:days[k]?.win})).filter(x=>x.win&&x.win.trim());return <div><div style={{display:'flex',gap:5,justifyContent:'space-between'}}>{cells.map((k,i)=>{const d=days[k]||{},ids=Object.keys(d.logged||{}),isToday=k===tk;return <div key={k} style={{flex:1,textAlign:'center'}}><div style={{...S.mono,fontSize:10,color:isToday?C.ink:C.faint,marginBottom:6}}>{DOW[i]}</div><div style={{display:'flex',flexDirection:'column',gap:3,alignItems:'center',minHeight:34,justifyContent:'flex-end',padding:'6px 0',borderRadius:8,background:isToday?C.ink+'08':'transparent'}}>{moves.map(m=><span key={m.id} style={{width:7,height:7,borderRadius:'50%',background:ids.includes(m.id)?m.accent:'transparent',border:ids.includes(m.id)?'none':'1px solid '+C.line}}/>)}</div></div>})}</div>{wins.length>0&&<div style={{marginTop:16}}>{wins.map(({k,win})=><div key={k} style={{display:'flex',gap:10,padding:'7px 0',borderTop:'1px solid '+C.line}}><span style={{...S.mono,fontSize:11,color:C.faint,flexShrink:0,width:34}}>{DOW[(parseKey(k).getDay()+6)%7]}</span><span style={{fontSize:14,lineHeight:1.5}}>{win}</span></div>)}</div>}</div>}
function DayArc({moves,logged}){const arcMoves=moves.filter(m=>TIME_POS[m.time]!=null);return <div style={{position:'relative',height:58,margin:'8px 2px 26px'}}><div style={{position:'absolute',left:0,right:0,top:28,height:1,background:'linear-gradient(90deg, '+C.dawn+', '+C.noon+', '+C.dusk+')',opacity:.5}}/>{arcMoves.map(m=>{const done=!!logged[m.id];return <div key={m.id} style={{position:'absolute',left:TIME_POS[m.time]+'%',top:28,transform:'translate(-50%,-50%)',textAlign:'center'}}><div style={{width:done?13:11,height:done?13:11,borderRadius:'50%',border:'1.5px solid '+m.accent,background:done?m.accent:C.paper,margin:'0 auto',transition:'all .25s'}}/><div style={{...S.mono,fontSize:9.5,color:done?m.accent:C.faint,marginTop:9,whiteSpace:'nowrap'}}>{m.time}</div></div>})}</div>}
function weekKeysFor(days,weeks,wk,{pastOnly=false,limit=8}={}){const set=new Set([...Object.keys(weeks||{}),...Object.keys(days||{}).map(k=>weekKeyForDate(parseKey(k)))]);let keys=[...set].filter(k=>!pastOnly||parseKey(k)<parseKey(wk)).sort((a,b)=>parseKey(b)-parseKey(a));return limit?keys.slice(0,limit):keys}
function summarizeWeek(k,config,days,weeks){const mon=parseKey(k),cells=Array.from({length:7},(_,i)=>fmtKey(addDays(mon,i)));const w=normalizeWeek(config,weeks[k]);const moves=activeMoves(config);const counts={};moves.forEach(m=>counts[m.id]=cells.filter(d=>days[d]?.logged?.[m.id]).length);const wins=cells.map(d=>({day:d,win:days[d]?.win})).filter(x=>x.win&&x.win.trim());const plan=clonePlan(w.plan);const done=plan.filter(p=>p.done&&p.text.trim()).length,total=plan.filter(p=>p.text.trim()).length;const tags={};plan.forEach(p=>(p.tags||[]).forEach(t=>{tags[t]=(tags[t]||0)+1}));return{key:k,span:shortDate(k)+' – '+shortDate(fmtKey(addDays(mon,6))),w,counts,wins,plan,done,total,tags}}
function TrackLayer({config,days,weeks,wk}){const keys=weekKeysFor(days,weeks,wk,{pastOnly:true,limit:null});if(!keys.length)return <p style={{...S.mono,fontSize:12.5,color:C.faint,lineHeight:1.7}}>No past weeks yet. When this week rolls over, it'll settle here as a quiet record — what you did, never what you didn't.</p>;return <div><p style={{fontSize:14,color:C.muted,lineHeight:1.6,margin:'0 0 24px'}}>Textual archive: the plan, what got checked, the tags attached to each belonging move, and each day’s one true thing.</p>{keys.map(k=>{const s=summarizeWeek(k,config,days,weeks);return <div key={k} style={S.weekCard}><div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:12}}><span style={{fontSize:16,fontWeight:600}}>{s.span}</span><span style={{...S.mono,fontSize:11,color:C.faint}}>{k}</span></div><div style={{...S.mono,fontSize:10.5,letterSpacing:1,textTransform:'uppercase',color:C.faint,marginBottom:6}}>belonging schedule</div>{s.plan.length?s.plan.map((p,i)=><div key={i} style={{padding:'6px 0',borderTop:i?'1px solid '+C.line:'none'}}><div style={{display:'flex',gap:8,alignItems:'baseline'}}><span style={{...S.mono,fontSize:10.5,color:p.day==='—'?C.faint:C.dusk,width:28,flexShrink:0}}>{p.day}</span><span style={{fontSize:13.5,lineHeight:1.4,color:p.done?C.faint:C.ink,textDecoration:p.done?'line-through':'none'}}>{p.text||'Untitled plan item'}</span>{p.done&&<span style={{...S.mono,fontSize:10.5,color:C.dusk}}>✓</span>}</div>{p.tags?.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:5,marginLeft:36}}>{p.tags.map(t=><span key={t} style={S.miniChip}>{t}</span>)}</div>}</div>):<div style={{...S.mono,fontSize:11.5,color:C.faint}}>No weekly plan recorded.</div>}<div style={{display:'flex',flexWrap:'wrap',gap:'6px 16px',marginTop:14}}>{activeMoves(config).map(m=><span key={m.id} style={{display:'flex',alignItems:'center',gap:7}}><span style={{width:8,height:8,borderRadius:'50%',background:m.accent}}/><span style={{...S.mono,fontSize:12,color:C.muted}}>{m.label} ×{s.counts[m.id]||0}</span></span>)}</div>{s.w.gear&&<div style={{marginTop:10}}><span style={{...S.miniChip,borderColor:C.ink+'44',color:C.ink}}>✓ published</span></div>}{s.w.checkedInAt&&<div style={{...S.mono,fontSize:11,color:C.faint,marginTop:10}}>weekly check-in logged {new Date(s.w.checkedInAt).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>}{s.wins.length>0&&<div style={{borderTop:'1px solid '+C.line,paddingTop:10,marginTop:12}}>{s.wins.map(({day,win})=><div key={day} style={{display:'flex',gap:10,marginBottom:5}}><span style={{...S.mono,fontSize:10.5,color:C.faint,flexShrink:0,width:30}}>{DOW[(parseKey(day).getDay()+6)%7]}</span><span style={{fontSize:13.5,lineHeight:1.5,color:C.ink}}>{win}</span></div>)}</div>}</div>})}</div>}
function VisualsLayer({config,days,weeks,wk}){const keys=weekKeysFor(days,weeks,wk,{pastOnly:false,limit:8}).reverse();const summaries=keys.map(k=>summarizeWeek(k,config,days,weeks));const moves=activeMoves(config);const tagCounts={};summaries.forEach(s=>Object.entries(s.tags).forEach(([t,n])=>tagCounts[t]=(tagCounts[t]||0)+n));const maxDaily=Math.max(1,...summaries.map(s=>moves.reduce((a,m)=>a+(s.counts[m.id]||0),0)));const maxTag=Math.max(1,...Object.values(tagCounts));return <div><p style={{fontSize:14,color:C.muted,lineHeight:1.6,margin:'0 0 24px'}}>A non-moralizing dashboard. It summarizes what has been showing up, not what kind of person you are.</p><Divider label='weekly shape'/>{summaries.map(s=>{const dailyTotal=moves.reduce((a,m)=>a+(s.counts[m.id]||0),0);const pct=s.total?Math.round(100*s.done/s.total):0;return <div key={s.key} style={{marginBottom:16}}><div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'baseline'}}><span style={{fontSize:14,fontWeight:600}}>{s.span}</span><span style={{...S.mono,fontSize:11,color:C.faint}}>{s.done}/{s.total||0} plan · {s.wins.length} lines</span></div><Bar label='daily moves' value={dailyTotal} max={maxDaily}/><Bar label='plan done' value={pct} max={100} suffix='%'/></div>})}<Divider label='move counts'/>{moves.map(m=>{const n=summaries.reduce((a,s)=>a+(s.counts[m.id]||0),0);return <Bar key={m.id} label={m.label} value={n} max={Math.max(1,...moves.map(mm=>summaries.reduce((a,s)=>a+(s.counts[mm.id]||0),0)))}/>})}<Divider label='belonging tags'/>{Object.keys(tagCounts).length?Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).map(([t,n])=><Bar key={t} label={t} value={n} max={maxTag}/>):<div style={{...S.mono,fontSize:12,color:C.faint}}>No tags logged yet.</div>}<Divider label='one true things'/><div style={{...S.bigNumber}}>{summaries.reduce((a,s)=>a+s.wins.length,0)}</div><div style={{...S.mono,fontSize:11.5,color:C.faint,marginTop:4}}>daily lines recorded in the weeks shown</div></div>}
function Bar({label,value,max,suffix=''}){const pct=Math.max(0,Math.min(100,(value/max)*100));return <div style={{marginTop:8}}><div style={{display:'flex',justifyContent:'space-between',gap:10,alignItems:'baseline'}}><span style={{...S.mono,fontSize:11,color:C.muted}}>{label}</span><span style={{...S.mono,fontSize:11,color:C.faint}}>{value}{suffix}</span></div><div style={{height:8,borderRadius:99,background:C.line,overflow:'hidden',marginTop:4}}><div style={{height:'100%',width:pct+'%',borderRadius:99,background:C.ink,opacity:.72}}/></div></div>}
function DesignLayer({config,setConfig}){const setMove=(i,patch)=>setConfig(c=>({...c,moves:c.moves.map((m,j)=>j===i?{...m,...patch}:m)}));const plan=config.belongingPlan||[];const addPlan=()=>setConfig(c=>({...c,belongingPlan:[...(c.belongingPlan||[]),{day:'—',text:''}]}));const setPlan=(i,patch)=>setConfig(c=>({...c,belongingPlan:c.belongingPlan.map((p,j)=>j===i?{...p,...patch}:p)}));const delPlan=i=>setConfig(c=>({...c,belongingPlan:c.belongingPlan.filter((_,j)=>j!==i)}));return <div><p style={{fontSize:14.5,color:C.muted,lineHeight:1.65,margin:'0 0 28px'}}>The standing template. New weeks copy from here; the current week’s schedule and tags are edited in Log and preserved in Track.</p><Divider label='three daily moves'/>{config.moves.map((m,i)=><div key={m.id} style={{padding:'16px 0',borderTop:i?'1px solid '+C.line:'none'}}><div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}><span style={{width:11,height:11,borderRadius:'50%',background:m.accent}}/><span style={{...S.mono,fontSize:10.5,letterSpacing:1,textTransform:'uppercase',color:m.accent}}>{m.time}</span></div><EditRow label='Goal' value={m.goal} onChange={v=>setMove(i,{goal:v})}/><EditRow label='Move' value={m.label} onChange={v=>setMove(i,{label:v})}/><EditRow label='If–then trigger' value={m.trigger} onChange={v=>setMove(i,{trigger:v})} area/><EditRow label='Note to self' value={m.note} onChange={v=>setMove(i,{note:v})} area/></div>)}<Divider label='rotating objective — optional fourth checkbox'/><p style={{...S.mono,fontSize:11.5,color:C.faint,lineHeight:1.6,margin:'0 0 12px'}}>Fill in the objective and it becomes a fourth daily checkbox in the Log. Leave it blank and it simply does not appear.</p><EditRow label='Goal it serves' value={config.objectiveGoal} onChange={v=>setConfig(c=>({...c,objectiveGoal:v}))}/><EditRow label='This month’s objective' value={config.objective} onChange={v=>setConfig(c=>({...c,objective:v}))}/><EditRow label='If–then trigger' value={config.objectiveTrigger} onChange={v=>setConfig(c=>({...c,objectiveTrigger:v}))} area/><Divider label='belonging template for new weeks'/><p style={{...S.mono,fontSize:11.5,color:C.faint,lineHeight:1.6,margin:'0 0 12px'}}>Standing defaults only. To change the live week, edit the schedule in Log.</p>{plan.map((p,i)=><div key={i} style={{display:'flex',gap:7,alignItems:'center',marginBottom:7}}><select value={p.day} onChange={e=>setPlan(i,{day:e.target.value})} style={S.daySelect}>{['—',...DOW].map(d=><option key={d} value={d}>{d}</option>)}</select><input value={p.text} onChange={e=>setPlan(i,{text:e.target.value})} placeholder='Frontrunners · philosophy club · a friend · a weird play…' style={{...S.input,flex:1}}/><button onClick={()=>delPlan(i)} style={S.del} aria-label='remove'>×</button></div>)}<button onClick={addPlan} style={S.addBtn}>+ add an idea</button><Divider label='belonging tag schema'/><EditRow label='Tags (comma-separated)' area value={config.schema.join(', ')} onChange={v=>setConfig(c=>({...c,schema:v.split(',').map(s=>s.trim()).filter(Boolean)}))}/><Divider label='publication — the witnessed stake'/><EditRow label='Weekly action' value={config.publication.label} onChange={v=>setConfig(c=>({...c,publication:{...c.publication,label:v}}))}/><EditRow label='Witness' value={config.publication.witness} onChange={v=>setConfig(c=>({...c,publication:{...c.publication,witness:v}}))}/><EditRow label='Stake' value={config.publication.stake} onChange={v=>setConfig(c=>({...c,publication:{...c.publication,stake:v}}))}/><p style={{...S.mono,fontSize:11.5,color:C.faint,marginTop:24,lineHeight:1.7}}>Saved automatically, on this device. No streaks, no scores — nothing here counts what you did not do.</p><Divider label='backup'/><p style={{...S.mono,fontSize:11.5,color:C.faint,lineHeight:1.6,margin:'0 0 12px'}}>Your data lives only in this browser. Export a copy now and then — to Files, iCloud, or email yourself — so a wipe is recoverable.</p><div style={{display:'flex',gap:8,flexWrap:'wrap'}}><button onClick={exportData} style={S.backupBtn}>Export a backup</button><label style={{...S.backupBtn,cursor:'pointer'}}>Import a backup<input type='file' accept='application/json,.json' style={{display:'none'}} onChange={e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const b=JSON.parse(reader.result);if(!b||b._app!=='days'){alert(`That does not look like a Days backup.`);return}if(!confirm(`Replace everything currently in this app with the backup? This cannot be undone.`))return;if(b.config)saveKey('days:config',b.config);saveKey('days:days',b.days||{});saveKey('days:weeks',b.weeks||{});alert('Backup restored. Reopening…');location.reload()}catch{alert(`Could not read that file.`)}};reader.readAsText(f);e.target.value=''}}/></label></div></div>}
const Check=({small})=><svg width={small?9:11} height={small?9:11} viewBox='0 0 12 12' fill='none'><path d='M2.5 6.2L5 8.7L9.5 3.5' stroke={C.paper} strokeWidth='1.7' strokeLinecap='round' strokeLinejoin='round'/></svg>;
const Toggle=({on,onClick,off,onLabel})=><button onClick={onClick} style={{...S.bigToggle,...(on?S.bigToggleOn:{})}}><span style={{...S.node,width:16,height:16,borderColor:C.ink,background:on?C.ink:'transparent'}}>{on?<Check small/>:null}</span>{on?onLabel:off}</button>;
const Divider=({label})=><div style={{display:'flex',alignItems:'center',gap:12,margin:'30px 0 16px'}}><span style={{...S.mono,fontSize:10.5,letterSpacing:1.5,textTransform:'uppercase',color:C.faint}}>{label}</span><span style={{flex:1,height:1,background:C.line}}/></div>;
const Field=({label,hint,children})=><div style={{marginTop:22}}><div style={S.fieldLabel}>{label}</div>{hint&&<div style={{...S.mono,fontSize:11,color:C.faint,marginTop:2}}>{hint}</div>}<div style={{marginTop:8}}>{children}</div></div>;
const EditRow=({label,value,onChange,area})=><div style={{marginBottom:12}}><div style={{...S.mono,fontSize:10.5,letterSpacing:.5,textTransform:'uppercase',color:C.faint,marginBottom:4}}>{label}</div>{area?<textarea value={value} onChange={e=>onChange(e.target.value)} rows={2} style={{...S.input,resize:'vertical',lineHeight:1.5}}/>:<input value={value} onChange={e=>onChange(e.target.value)} style={S.input}/>}</div>;
const C={paper:'#E9E5DC',surface:'#F4F1EA',ink:'#23211C',muted:'#6C685E',faint:'#9A968B',line:'#D6D1C5',dawn:'#B0813A',noon:'#4E6E8E',dusk:'#6E5A7E'};
const serif=`'Newsreader', Georgia, 'Times New Roman', serif`;const mono=`'Spline Sans Mono', ui-monospace, 'SFMono-Regular', monospace`;
const S={page:{minHeight:'100vh',background:C.paper,color:C.ink,fontFamily:serif,WebkitFontSmoothing:'antialiased'},wrap:{maxWidth:560,margin:'0 auto',padding:'max(40px, env(safe-area-inset-top)) 22px 90px'},mono:{fontFamily:mono},mark:{fontFamily:serif,fontSize:32,fontWeight:600,letterSpacing:-.5,lineHeight:1},tab:{fontFamily:mono,fontSize:12.5,letterSpacing:.5,padding:'7px 16px',borderRadius:999,border:'1px solid '+C.line,background:'transparent',color:C.muted,cursor:'pointer'},tabOn:{background:C.ink,color:C.paper,borderColor:C.ink},move:{display:'flex',gap:14,alignItems:'flex-start',padding:'16px 14px',borderRadius:12,border:'1px solid',marginBottom:10,transition:'background .2s, border-color .2s'},node:{flexShrink:0,width:22,height:22,borderRadius:'50%',border:'1.5px solid',cursor:'pointer',display:'grid',placeItems:'center',marginTop:1,transition:'background .2s'},moveLabel:{fontSize:17,fontWeight:500},trigger:{fontSize:13.5,color:C.muted,lineHeight:1.5,marginTop:4,fontStyle:'italic'},noteInput:{width:'100%',marginTop:9,padding:'7px 0',border:'none',borderBottom:'1px solid '+C.line,background:'transparent',fontFamily:mono,fontSize:12.5,color:C.ink,outline:'none'},fieldLabel:{fontSize:15,fontWeight:600},lineInput:{width:'100%',padding:'10px 0',border:'none',borderBottom:'1.5px solid '+C.line,background:'transparent',fontFamily:serif,fontSize:16,color:C.ink,outline:'none'},planCard:{padding:'9px 0',borderTop:'1px solid '+C.line},chip:{fontFamily:mono,fontSize:12,padding:'7px 13px',borderRadius:999,cursor:'pointer',border:'1px solid '+C.line,background:'transparent',color:C.faint,transition:'all .15s'},chipOn:{borderColor:C.dusk,background:C.dusk+'1A',color:C.dusk,fontWeight:500},miniChip:{fontFamily:mono,fontSize:11,padding:'4px 9px',borderRadius:999,border:'1px solid '+C.line,color:C.muted},bigToggle:{width:'100%',display:'flex',alignItems:'center',gap:11,padding:'14px 16px',borderRadius:12,border:'1px solid '+C.line,background:'transparent',color:C.muted,cursor:'pointer',fontFamily:serif,fontSize:15.5,textAlign:'left'},bigToggleOn:{borderColor:C.ink+'44',background:C.ink+'08',color:C.ink},input:{width:'100%',padding:'9px 11px',borderRadius:8,border:'1px solid '+C.line,background:C.surface,fontFamily:serif,fontSize:14.5,color:C.ink,outline:'none',boxSizing:'border-box'},daySelect:{fontFamily:mono,fontSize:12,padding:'8px 6px',borderRadius:8,border:'1px solid '+C.line,background:C.surface,color:C.muted,outline:'none',flexShrink:0},addBtn:{fontFamily:mono,fontSize:12,padding:'8px 14px',borderRadius:999,border:'1px dashed '+C.line,background:'transparent',color:C.muted,cursor:'pointer',marginTop:4},del:{flexShrink:0,width:28,height:28,borderRadius:8,border:'1px solid '+C.line,background:'transparent',color:C.faint,cursor:'pointer',fontSize:16,lineHeight:1},weekCard:{padding:'18px',borderRadius:14,border:'1px solid '+C.line,background:C.surface+'99',marginBottom:14},backupBtn:{fontFamily:mono,fontSize:12.5,padding:'10px 16px',borderRadius:999,border:'1px solid '+C.line,background:C.surface,color:C.ink,cursor:'pointer',display:'inline-block'},bigNumber:{fontSize:42,fontWeight:600,lineHeight:1}};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
