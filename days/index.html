{*{transition:none!important}}</style></head><body><div id='root'></div><script>(function(){var icon='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='108' fill='#23211C'/><line x1='96' y1='256' x2='416' y2='256' stroke='#6C685E' stroke-width='5'/><circle cx='152' cy='256' r='26' fill='#B0813A'/><circle cx='256' cy='256' r='26' fill='#4E6E8E'/><circle cx='360' cy='256' r='26' fill='#6E5A7E'/></svg>`);var manifest={name:'Days',short_name:'Days',start_url:'.',display:'standalone',background_color:'#E9E5DC',theme_color:'#E9E5DC',icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};var blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});var link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(blob);document.head.appendChild(link)})();</script><script type='text/babel' data-presets='react'>const{useState,useEffect}=React;function loadKey(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch{return fallback}}function saveKey(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}function exportData(){const bundle={_app:'days',_version:2,_exportedAt:new Date().toISOString(),config:loadKey('days:config',null),days:loadKey('days:days',{}),weeks:loadKey('days:weeks',{})};const blob=new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');const stamp=new Date().toISOString().slice(0,10);a.href=url;a.download='days-backup-'+stamp+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000)}const fmtKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const parseKey=k=>{const[y,m,dd]=k.split('-').map(Number);return new Date(y,m-1,dd)};const mondayOf=d=>{const x=new Date(d);const off=(x.getDay()+6)%7;x.setDate(x.getDate()-off);x.setHours(0,0,0,0);return x};const todayKey=()=>fmtKey(new Date());const weekKeyForDate=d=>fmtKey(mondayOf(d));const weekKey=()=>weekKeyForDate(new Date());const prettyDate=k=>parseKey(k).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});const shortDate=k=>parseKey(k).toLocaleDateString(undefined,{month:'short',day:'numeric'});const nowTime=()=>new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];const DEFAULT_CONFIG={moves:[{id:'platform',goal:'Public platform',label:'400 words',time:'morning',accent:'#B0813A',trigger:`If I've made my morning coffee and I'm at the shoe rack — I write.`,note:`ABD by default. CIT when it's alive — but as writing, never the job action.`},{id:'job',goal:'Creativity without financial anxiety',label:'Job action',time:'afternoon',accent:'#4E6E8E',trigger:`If I've finished gym + smoothie and I'm at the café — I do the hardest job thing first.`,note:'Always the afternoon café. This is the test of the one-and-done paralysis.'},{id:'belonging',goal:'Belonging',label:'One contact move',time:'evening',accent:'#6E5A7E',trigger:`If I've ended my café session — one real move toward another person before I leave.`,note:'A text, an RSVP, a schedule. One thing that creates a future.'}],schema:['New thing','Same thing','Solitude','Bar','Friend','Freespace'],belongingPlan:[{day:'—',text:'Frontrunners'},{day:'Wed',text:'Philosophy club'},{day:'Fri',text:'See a friend'}],publication:{label:'Publish or revise',witness:'Adam',stake:'$5'},objective:'',objectiveGoal:'',objectiveTrigger:'',objectiveAccent:'#5E7A5E'};const TIME_POS={morning:18,afternoon:52,evening:84};const clonePlan=plan=>(plan||[]).map(p=>({day:p.day||'—',text:p.text||'',done:!!p.done}));const makeWeek=config=>({plan:clonePlan(config.belongingPlan||[]),spread:[],gear:false,planUpdatedAt:new Date().toISOString()});const normalizeWeek=(config,w)=>{const base=makeWeek(config);return{...base,...(w||{}),plan:w?.plan?clonePlan(w.plan):base.plan,spread:w?.spread||[],gear:!!w?.gear}};const activeMoves=config=>{const base=config.moves;if(config.objective&&config.objective.trim())return[...base,{id:'objective',goal:config.objectiveGoal||'Rotating objective',label:config.objective.trim(),eyebrow:'rotating',accent:config.objectiveAccent||'#5E7A5E',trigger:config.objectiveTrigger||''}];return base};function App(){const[mode,setMode]=useState('log');const[config,setConfig]=useState(()=>loadKey('days:config',DEFAULT_CONFIG));const[days,setDays]=useState(()=>loadKey('days:days',{}));const[weeks,setWeeks]=useState(()=>loadKey('days:weeks',{}));const tk=todayKey();const wk=weekKey();const today=days[tk]||{logged:{},win:''};const week=normalizeWeek(config,weeks[wk]);useEffect(()=>{saveKey('days:config',config)},[config]);useEffect(()=>{saveKey('days:days',days)},[days]);useEffect(()=>{saveKey('days:weeks',weeks)},[weeks]);useEffect(()=>{setWeeks(w=>w[wk]?.plan?w:{...w,[wk]:normalizeWeek(config,w[wk])})},[wk]);const setToday=patch=>setDays(d=>({...d,[tk]:{...today,...patch}}));const setWeek=patch=>setWeeks(w=>{const current=normalizeWeek(config,w[wk]);const update=typeof patch==='function'?patch(current):patch;return{...w,[wk]:{...current,...update,planUpdatedAt:new Date().toISOString()}}});return <div style={S.page}><div style={S.wrap}><Header mode={mode} setMode={setMode} tk={tk}/>{mode==='log'&&<LogLayer {...{config,today,week,setToday,setWeek,days,tk}}/>}{mode==='design'&&<DesignLayer {...{config,setConfig}}/>}{mode==='track'&&<TrackLayer {...{config,days,weeks,wk}}/>}</div></div>}function Header({mode,setMode,tk}){return <header style={{marginBottom:32}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',flexWrap:'wrap',gap:8}}><div><div style={S.mark}>Days</div><div style={{...S.mono,color:C.faint,fontSize:12,marginTop:2}}>where can we live but days</div></div><div style={{...S.mono,color:C.muted,fontSize:12}}>{prettyDate(tk)}</div></div><div style={{display:'flex',gap:4,marginTop:22}}>{[['log','Log'],['design','Design'],['track','Track']].map(([id,lbl])=><button key={id} onClick={()=>setMode(id)} style={{...S.tab,...(mode===id?S.tabOn:{})}}>{lbl}</button>)}</div></header>}function LogLayer({config,today,week,setToday,setWeek,days,tk}){const moves=activeMoves(config);const plan=week.plan||[];const logMove=id=>{if(today.logged[id]){const{[id]:_,...rest}=today.logged;setToday({logged:rest})}else{const m=moves.find(x=>x.id===id);const entry={time:nowTime()};if(m){entry.label=m.label;entry.accent=m.accent}setToday({logged:{...today.logged,[id]:entry}})}};const setMoveNote=(id,text)=>setToday({logged:{...today.logged,[id]:{...today.logged[id],note:text}}});const toggleSpread=c=>setWeek({spread:week.spread.includes(c)?week.spread.filter(x=>x!==c):[...week.spread,c]});const setPlan=next=>setWeek({plan:next});const setPlanItem=(i,patch)=>setPlan(plan.map((p,j)=>j===i?{...p,...patch}:p));const addPlan=()=>setPlan([...plan,{day:'—',text:'',done:false}]);const delPlan=i=>setPlan(plan.filter((_,j)=>j!==i));const resetPlan=()=>{if(!plan.length||confirm(`Replace this week's plan with the Design template?`))setPlan(clonePlan(config.belongingPlan||[]))};return <div><DayArc moves={moves} logged={today.logged}/><section style={{marginTop:6}}>{moves.map(m=>{const done=!!today.logged[m.id];const eyebrow=m.time||m.eyebrow||'';return <div key={m.id} style={{...S.move,borderColor:done?m.accent+'55':C.line,background:done?m.accent+'0E':'transparent'}}><button onClick={()=>logMove(m.id)} aria-label={'log '+m.label} style={{...S.node,borderColor:m.accent,background:done?m.accent:'transparent'}}>{done?<Check/>:null}</button><div style={{flex:1,minWidth:0}}><div style={{display:'flex',alignItems:'baseline',gap:8,flexWrap:'wrap'}}>{eyebrow&&<span style={{...S.mono,fontSize:10.5,letterSpacing:1,textTransform:'uppercase',color:m.accent}}>{eyebrow}</span>}<span style={S.moveLabel}>{m.label}</span>{done&&<span style={{...S.mono,fontSize:11,color:C.faint}}>· logged {today.logged[m.id].time}</span>}</div>{m.trigger?<div style={S.trigger}>{m.trigger}</div>:null}{done&&<input value={today.logged[m.id].note||''} onChange={e=>setMoveNote(m.id,e.target.value)} placeholder='what it was, if you want to remember…' style={S.noteInput}/>}</div></div>})}</section><Field label='Today, in a line'><input value={today.win||''} onChange={e=>setToday({win:e.target.value})} placeholder='one true thing about today — even a small one' style={S.lineInput}/></Field><Divider label='this week'/><Field label='Belonging — planned this week' hint='editable weekly plan; Track keeps this week’s version'><div style={{marginTop:6}}>{plan.length===0?<div style={{...S.mono,fontSize:11.5,color:C.faint}}>no weekly plan yet — add one here or copy the Design template.</div>:plan.map((p,i)=><div key={i} style={{display:'flex',gap:7,alignItems:'center',marginBottom:7}}><button onClick={()=>setPlanItem(i,{done:!p.done})} style={{...S.node,width:18,height:18,borderColor:C.dusk,background:p.done?C.dusk:'transparent',marginTop:0}} aria-label='mark plan item done'>{p.done?<Check small/>:null}</button><select value={p.day} onChange={e=>setPlanItem(i,{day:e.target.value})} style={S.daySelect}>{['—',...DOW].map(d=><option key={d} value={d}>{d}</option>)}</select><input value={p.text} onChange={e=>setPlanItem(i,{text:e.target.value})} placeholder='Frontrunners · philosophy club · a friend · a weird play…' style={{...S.input,flex:1,textDecoration:p.done?'line-through':'none',color:p.done?C.faint:C.ink}}/><button onClick={()=>delPlan(i)} style={S.del} aria-label='remove'>×</button></div>)}</div><div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:8}}><button onClick={addPlan} style={S.addBtn}>+ add to this week</button><button onClick={resetPlan} style={S.addBtn}>copy Design template</button></div></Field><Field label='Belonging — what the week actually touched' hint='a map, not }}>{wins.map(({k,win})=><div key={k} style={{display:'flex',gap:10,padding:'7px 0',borderTop:'1px solid '+C.line}}><span style={{...S.mono,fontSize:11,color:C.faint,flexShrink:0,width:34}}>{DOW[(parseKey(k).getDay()+6)%7]}</span><span style={{fontSize:14,lineHeight:1.5}}>{win}</span></div>)}</div>}</div>}function DayArc({moves,logged}){const arcMoves=moves.filter(m=>TIME_POS[m.time]!=null);return <div style={{position:'relative',height:58,margin:'8px 2px 26px'}}><div style={{position:'absolute',left:0,right:0,top:28,height:1,background:'linear-gradient(90deg, '+C.dawn+', '+C.noon+', '+C.dusk+')',opacity:.5}}/>{arcMoves.map(m=>{const done=!!logged[m.id];return <div key={m.id} style={{position:'absolute',left:TIME_POS[m.time]+'%',top:28,transform:'translate(-50%,-50%)',textAlign:'center'}}><div style={{width:done?13:11,height:done?13:11,borderRadius:'50%',border:'1.5px solid '+m.accent,background:done?m.accent:C.paper,margin:'0 auto',transition:'all .25s'}}/><div style={{...S.mono,fontSize:9.5,color:done?m.accent:C.faint,marginTop:9,whiteSpace:'nowrap'}}>{m.time}</div></div>})}</div>}function TrackLayer({config,days,weeks,wk}){const groups={};Object.keys(days).forEach(k=>{const wkk=weekKeyForDate(parseKey(k));if(wkk===wk)return;(groups[wkk]=groups[wkk]||[]).push(k)});Object.keys(weeks).forEach(wkk=>{if(wkk!==wk&&!groups[wkk])groups[wkk]=[]});const weekKeys=Object.keys(groups).sort().reverse();const movesForWeek=dayKeys=>{const stored=id=>{for(const k of dayKeys){const e=days[k]?.logged?.[id];if(e&&(e.label||e.accent))return e}return null};const core=config.moves.map(m=>{const e=stored(m.id);return{id:m.id,label:e?.label||m.label,accent:e?.accent||m.accent}});let hasObj=false,objLabel='Rotating objective',objAccent='#5E7A5E';dayKeys.forEach(k=>{const o=days[k]?.logged?.objective;if(o){hasObj=true;if(o.label)objLabel=o.label;if(o.accent)objAccent=o.accent}});return hasObj?[...core,{id:'objective',label:objLabel,accent:objAccent}]:core};if(!weekKeys.length)return <p style={{...S.mono,fontSize:12.5,color:C.faint,lineHeight:1.7}}>No past weeks yet. When this week rolls over, it'll settle here as a quiet record — what you did, never what you didn't.</p>;return <div><p style={{fontSize:14,color:C.muted,lineHeight:1.6,margin:'0 0 24px'}}>Previous weeks, at a glance. Read for the shape, not the score.</p>{weekKeys.map(wkk=>{const dayKeys=groups[wkk].sort();const w=weeks[wkk]||{};const plan=clonePlan(w.plan||[]);const moves=movesForWeek(dayKeys);const counts={};moves.forEach(m=>{counts[m.id]=dayKeys.filter(k=>days[k]?.logged?.[m.id]).length});const wins=dayKeys.map(k=>({k,win:days[k]?.win})).filter(x=>x.win&&x.win.trim());const span=dayKeys.length?shortDate(dayKeys[0])+' – '+shortDate(dayKeys[dayKeys.length-1]):'Week of '+shortDate(wkk);return <div key={wkk} style={S.weekCard}><div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:12}}><span style={{fontSize:16,fontWeight:600}}>{span}</span><span style={{...S.mono,fontSize:11,color:C.faint}}>{wkk}</span></div><div style={{marginBottom:12}}><div style={{...S.mono,fontSize:10.5,letterSpacing:1,textTransform:'uppercase',color:C.faint,marginBottom:6}}>planned</div>{plan.length?plan.map((p,i)=><div key={i} style={{display:'flex',gap:8,alignItems:'baseline',padding:'3px 0'}}><span style={{...S.mono,fontSize:10.5,color:p.day==='—'?C.faint:C.dusk,width:28,flexShrink:0}}>{p.day}</span><span style={{fontSize:13.5,lineHeight:1.4,color:p.done?C.faint:C.ink,textDecoration:p.done?'line-through':'none'}}>{p.text||'Untitled plan item'}</span>{p.done&&<span style={{...S.mono,fontSize:10.5,color:C.dusk}}>✓</span>}</div>):<div style={{...S.mono,fontSize:11.5,color:C.faint}}>No weekly plan recorded.</div>}</div><div style={{display:'flex',flexWrap:'wrap',gap:'6px 16px',marginBottom:(w.spread?.length||wins.length||w.gear)?12:0}}>{moves.map(m=><span key={m.id} style={{display:'flex',alignItems:'center',gap:7}}><span style={{width:8,height:8,borderRadius:'50%',background:m
